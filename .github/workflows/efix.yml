name: EBRM final repair
on:
  push:
    paths:
      - '.github/workflows/efix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local NT Bible data from public WEBP corpus
        run: |
          mkdir -p data
          curl -fsSL https://raw.githubusercontent.com/mrapacz/targum-corpus/master/corpus/ebible.org/eng/engwebp.jsonl -o /tmp/engwebp.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          nt=['MAT','MRK','LUK','JHN','ACT','ROM','1CO','2CO','GAL','EPH','PHP','COL','1TH','2TH','1TI','2TI','TIT','PHM','HEB','JAS','1PE','2PE','1JN','2JN','3JN','JUD','REV']
          names={'MAT':'Matthew','MRK':'Mark','LUK':'Luke','JHN':'John','ACT':'Acts','ROM':'Romans','1CO':'1 Corinthians','2CO':'2 Corinthians','GAL':'Galatians','EPH':'Ephesians','PHP':'Philippians','COL':'Colossians','1TH':'1 Thessalonians','2TH':'2 Thessalonians','1TI':'1 Timothy','2TI':'2 Timothy','TIT':'Titus','PHM':'Philemon','HEB':'Hebrews','JAS':'James','1PE':'1 Peter','2PE':'2 Peter','1JN':'1 John','2JN':'2 John','3JN':'3 John','JUD':'Jude','REV':'Revelation'}
          books={b:{'id':b,'commonName':names[b],'name':names[b],'title':names[b],'chapters':{}} for b in nt}
          for line in Path('/tmp/engwebp.jsonl').open(encoding='utf-8'):
              x=json.loads(line)
              b=x.get('book');
              if b not in books: continue
              ch=int(x['chapter']); v=x['verse']; text=x['text']
              books[b]['chapters'].setdefault(ch,[]).append({'type':'verse','number':int(v),'text':text,'footnotes':[]})
          out={'translation':{'id':'engwebp','name':'World English Bible'},'books':[]}
          for b in nt:
              chapters=[]
              for ch in sorted(books[b]['chapters']):
                  verses=sorted(books[b]['chapters'][ch],key=lambda z:z['number'])
                  chapters.append({'number':ch,'chapter':{'number':ch,'content':verses}})
              out['books'].append({'id':b,'commonName':names[b],'name':names[b],'title':names[b],'numberOfChapters':len(chapters),'chapters':chapters})
          Path('data/nt-engwebp.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          print('books',len(out['books']),'chapters',sum(len(b['chapters']) for b in out['books']))
          if len(out['books'])!=27 or sum(len(b['chapters']) for b in out['books'])!=260: raise SystemExit('NT data incomplete')
          PY
      - name: Repair reader and speech
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          if "const LOCAL_BIBLE='./data/nt-engwebp.json';" not in s:
              s=s.replace("const API='https://bible.helloao.org/api/engwebp';", "const API='https://bible.helloao.org/api/engwebp'; const LOCAL_BIBLE='./data/nt-engwebp.json'; let LOCAL_BIBLE_DATA=null;")
          pat=r"async function loadChapter\(\)\{[\s\S]*?\n\}\nfunction renderVerses\(\)\{"
          new='''async function loadChapter(){\n const b=book(); $('chapterTitle').textContent=`${b[1]} ${state.chapter}`; $('sourceMeta').textContent='World English Bible · 本地经文优先'; $('verseArea').innerHTML='<div class="loader">正在载入英文经文…</div>';\n try{\n  if(!LOCAL_BIBLE_DATA){const r=await fetch(LOCAL_BIBLE,{cache:'no-store'}); if(!r.ok) throw new Error('local'); LOCAL_BIBLE_DATA=await r.json();}\n  const lb=LOCAL_BIBLE_DATA.books?.find(x=>x.id===b[0]); const c=lb?.chapters?.find(x=>Number(x.number??x.chapter?.number)===state.chapter); const ch=c?.chapter||c; if(!ch?.content?.length) throw new Error('chapter'); state.data={chapter:ch};\n }catch(e){\n  try{const r=await fetch(`${API}/${b[0]}/${state.chapter}.simple.json`,{cache:'no-store'}); if(!r.ok) throw new Error('api'); state.data=await r.json(); $('sourceMeta').textContent='World English Bible · 在线 API';}\n  catch(e2){$('verseArea').innerHTML='<div class="card"><b>经文暂时无法显示</b><p style="margin-top:6px">系统已尝试本地经文与在线 API。请刷新后重试。</p><button class="btn primary" style="margin-top:9px" onclick="loadChapter()">重新加载</button></div>'; return;}\n }\n renderVerses(); renderTraining(); fillChapters(); if(typeof navState==='function') navState();\n}\nfunction renderVerses(){'''
          s,n=re.subn(pat,new,s,1)
          if n!=1: raise SystemExit('loadChapter not found')
          s=s.replace("function speakCurrent(){const text=(state.data?.chapter?.content||[]).filter(x=>x.type==='verse').map(v=>v.text).join(' ');if(!('speechSynthesis'in window)){toast('当前浏览器不支持朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.92;speechSynthesis.speak(u);setStep('listen',true)}", "function speakCurrent(){const text=(state.data?.chapter?.content||[]).filter(x=>x.type==='verse').map(v=>v.text).join(' ').trim();if(!text){toast('经文尚未载入');return}if(!('speechSynthesis'in window)){toast('当前浏览器不支持朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.92;u.onend=()=>setStep('listen',true);speechSynthesis.speak(u)}")
          Path('index.html').write_text(s)
          PY
          cat > sw.js <<'EOF'
          const CACHE="ebrm-v1-final6";
          const SHELL=["./","./index.html","./john1.html","./app.js","./style.css","./manifest.json"];
          self.addEventListener("install",e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting())));
          self.addEventListener("activate",e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;const u=new URL(e.request.url);if(u.origin===self.location.origin)e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put(e.request,c));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match("./index.html"))));
          });
          EOF
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\\s\\S]*)<\\/script>/);fs.writeFileSync('/tmp/e.js',m[1]);"
          node --check /tmp/e.js
      - name: Commit final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js data/nt-engwebp.json
          git diff --cached --quiet || (git commit -m 'fix: finalize local NT scripture reader' && git push)
